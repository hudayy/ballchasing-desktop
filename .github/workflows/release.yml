name: Release

# Builds the Windows installer and publishes a GitHub Release whenever a version
# tag (vX.Y.Z) is pushed. electron-updater reads latest.yml from the published
# release to auto-update installed copies.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package installer (electron-builder)
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
